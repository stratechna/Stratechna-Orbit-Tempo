name: Testes do Tempo

# Corre os testes da app num Frappe montado de raiz, com MariaDB e Redis do próprio
# GitHub. Nada disto toca no Apps02: é lá que estão os tenants dos clientes.
#
# Versão 2 (18-10-2026, T3): o Tempo vive no Orbit — o site de testes leva o ERPNext.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=20
      redis-cache:
        image: redis:7-alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:7-alpine
        ports: ["11000:6379"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Interface compilada é a do repositório
        # O pacote vai no repositório (a imagem do Orbit não compila esta app); aqui confirma-se
        # que é exactamente o que sai do código-fonte.
        working-directory: app/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git -C .. diff --stat --exit-code -- orbit_tempo/public/frontend \
            || { echo "ERRO: o pacote em orbit_tempo/public/frontend não corresponde ao código. Correr npm run build e juntar."; exit 1; }
      - name: Motor (sem bench)
        working-directory: app
        run: python -m unittest orbit_tempo.testes.test_motor
      - name: Bench com ERPNext
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client >/dev/null || true
          pip install -q frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" bench
          cd bench
          bench set-config -g redis_cache redis://localhost:13000
          bench set-config -g redis_queue redis://localhost:11000
          bench set-config -g redis_socketio redis://localhost:13000
          bench get-app --skip-assets erpnext https://github.com/frappe/erpnext --branch version-16
          bench get-app --skip-assets orbit_tempo "$GITHUB_WORKSPACE/app"
      - name: Site (ERPNext + Tempo)
        working-directory: bench
        run: |
          bench new-site teste.local --db-root-password root --admin-password admin \
            --mariadb-user-host-login-scope=% --install-app erpnext --install-app orbit_tempo
          bench --site teste.local set-config allow_tests true
      - name: Testes de integração
        working-directory: bench
        # o before_tests do ERPNext prepara a empresa, os grupos e as listas de preços
        run: bench --site teste.local run-tests --module orbit_tempo.testes.test_integracao
      - name: Ponta a ponta por HTTP (/tempo e /cliente)
        working-directory: bench
        run: |
          bench use teste.local
          bench serve --port 8000 > serve.log 2>&1 &
          for i in $(seq 1 40); do curl -sf -o /dev/null localhost:8000/api/method/ping && break; sleep 2; done
          H="Host: teste.local"
          # sem sessão: /tempo manda entrar; /cliente mostra a entrada do cliente
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$H" localhost:8000/tempo)" = "302"
          curl -sf -H "$H" localhost:8000/cliente | grep -q '"modo": "entrar"'
          curl -sf -c jar -H "$H" -X POST localhost:8000/api/method/login -d usr=Administrator -d pwd=admin >/dev/null
          curl -sf -b jar -H "$H" localhost:8000/tempo -o tempo.html
          grep -q '"modo": "admin"' tempo.html && grep -q "/assets/orbit_tempo/frontend/tempo.js" tempo.html
          curl -sf -b jar -H "$H" localhost:8000/tempo/clientes | grep -q "TEMPO_BOOT"
          curl -sf -b jar -H "$H" localhost:8000/api/method/orbit_tempo.api.arranque | grep -q '"regimes"'
          TOKEN=$(python -c "import re,json;h=open('tempo.html').read();print(json.loads(re.search(r'TEMPO_BOOT = (\{.*\});</script>',h).group(1))['csrf_token'])")
          curl -sf -b jar -H "$H" -H "X-Frappe-CSRF-Token: $TOKEN" -H "Content-Type: application/json" \
            -X POST localhost:8000/api/method/orbit_tempo.api.novo_cliente -d '{"dados": {"nome": "Cliente HTTP"}}' | grep -q "Cliente HTTP"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar -H "$H" -H "Content-Type: application/json" -X POST \
            localhost:8000/api/method/orbit_tempo.api.novo_cliente -d '{"dados": {"nome": "X"}}')" != "200"
          echo "ponta a ponta: ok"
      - name: Traduções (sem bench)
        if: always()
        working-directory: app
        run: python -m unittest orbit_tempo.testes.test_traducoes
